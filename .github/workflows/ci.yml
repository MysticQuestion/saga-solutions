name: Saga Systems CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/revenue-ready-saga-site]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check api/create-checkout.js
          node --check api/contact.js
          node --check api/payment-confirmation.js
          node --check api/submit-project.js
          node --check api/editorial-draft.js
          node --check src/bridge.js
          node --check src/editorial-cleanup.js
          node --check src/commerce-bridge.js
          node --check public/checkout.js

      - name: Build production bundle
        run: npm run build
